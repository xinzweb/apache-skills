[project]
name = "cloudberry-segment-adapter"
version = "0.1.0"
description = "Thin MCP server exposing Apache Cloudberry segment health, distribution-policy, and skew visibility not covered by generic Postgres MCP servers."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0",
    "psycopg2-binary>=2.9",
]

[project.scripts]
cloudberry-segment-adapter = "cloudberry_segment_adapter.server:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
